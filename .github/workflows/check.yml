name: Nautilus checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  map-workshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check -- --tracked
      - run: npm test
      - run: npm run test:upstream
      - run: npm run build
