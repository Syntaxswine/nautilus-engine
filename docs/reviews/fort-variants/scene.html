<header><div><h1>Castle + cyclone · modular variants</h1><p>Original fictional compound · native metres · 3 m planning grid · 2.12 m walkway datum</p></div><label>Assembly <select id="asset"></select></label><label>View <select id="view"><option>exterior</option><option>rear</option><option>top</option><option>roof-off</option><option>grey</option><option>wire</option><option>plan</option><option>cutaway</option><option>gate-exterior</option><option>gate-interior</option><option>gate-swing</option><option>access</option><option>joint</option></select></label><button id="doors">Open gates</button></header>

<script type="module">
import * as T from '../../../vendor/aft/781246a668c723d5a4c5463e70534cc04b6a5641/dist/tactics/vendor/three.module.js';
import {VARIANT_BUILDINGS,VARIANT_PARTS,variantRecipe,variantFloorSvg} from '../../../packages/fort-variants/index.js';
import {VARIANT_LAYOUTS} from '../../../packages/fort-variants/layouts.js';

const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});

const loader=new T.TextureLoader(),atlas=await loader.loadAsync('../../../assets/buildings/painted-materials-v2.png'),eraAtlas=await loader.loadAsync('../../../assets/fort-variants/painted-era-materials-v1.png');

const scene=new T.Scene();scene.background=new T.Color(0xe5e3d5);scene.add(new T.HemisphereLight(0xfff4df,0x667a6c,1.7));

const assets=[...VARIANT_LAYOUTS,...VARIANT_BUILDINGS,...VARIANT_PARTS],asset=document.querySelector('#asset'),views=document.querySelector('#view');

let model,camera,selected=assets[0].id,view='exterior',level=0,lod='game',opened=false,oneLeaf=false,extras=[],active=true;
for(const name of['roof-join','transition','fence-detail','deck-detail','stair-detail','stair-top']){const option=document.createElement('option');option.textContent=name;views.append(option);}
function clearModels(){model?.dispose();for(const extra of extras)extra.dispose();extras=[];}
function render(){
  if(!active)return;
  const W=innerWidth,H=920,b=model.building;renderer.setSize(W,H,false);
  const bounds=['roof-join','transition'].includes(view)?{min:[-6,-.12,-.405],max:[view==='transition'?9:12,3.42,6.405]}:model.bounds,extent=bounds.max.map((v,i)=>v-bounds.min[i]),center=new T.Vector3(...bounds.min.map((v,i)=>(v+bounds.max[i])/2));

  if(view==='rear')az=45;if(view==='top'){az=90;el=90;center.y=0;}if(view==='wire')el=45;
  if(view==='access'){az=45;el=49;}
  if(view==='stair-detail'){az=45;el=38;}
  if(view==='stair-top'){az=90;el=90;center.y=0;}

  if(view.startsWith('gate-')){
    const assembly=!!b.layout,mid=assembly?b.width/2:9,z=assembly?3:0;
    center.set(mid,3.8,z+(view==='gate-interior'?6:0));az=view==='gate-interior'?90:270;el=13;ppu=80;close=true;

  }
  if(view==='fence-detail'){center.set(3,1.8,0);az=235;el=15;ppu=190;close=true;}
  if(view==='deck-detail'){center.set(3,2.12,.91);az=225;el=63;ppu=200;close=true;}
  if(view==='joint'){center.set(9,2.1,6.8);az=45;el=30;ppu=130;close=true;}
  const cut=view==='cutaway',roof=!['roof-off','cutaway','plan'].includes(view);
  model.setView({roof,maxLevel:cut?level:Infinity});
  if(cut)for(const child of model.root.children)if(child.userData.level<level&&!(child.userData.kind==='stairs'&&child.userData.level===level-1))child.visible=false;
  if(!close){const a=az*Math.PI/180,e=el*Math.PI/180,horizontal=Math.abs(Math.sin(a))*extent[0]+Math.abs(Math.cos(a))*extent[2],
    vertical=(Math.abs(Math.cos(a))*extent[0]+Math.abs(Math.sin(a))*extent[2])*Math.sin(e)+extent[1]*Math.cos(e);

  return {id:b.id,view,level,lod,metrics:model.data.metrics,bounds:model.bounds,visibleDraws:renderer.info.render.calls,renderedTriangles:renderer.info.render.triangles,

    gateLeaves:model.pivots.filter(p=>['gate','sally'].includes(p.userData.style)).map(p=>({id:p.name,pivot:p.position.toArray(),yaw:p.rotation.y,side:p.userData.side,clearOpenWidth:p.userData.clearOpenWidth}))};

function set(options={}){
  selected=options.id||selected;view=options.view||view;level=options.level??level;lod=options.lod||lod;opened=options.opened??opened;oneLeaf=options.oneLeaf??false;

  if(view==='transition'){const reversed=selected==='link-cyclone-to-castle';for(const[id,x]of[[reversed?'cyclone-fence-6':'castle-curtain-6',-6],[reversed?'castle-curtain-6':'cyclone-fence-6',3]]){const extra=createVariantModel(T,id,{atlas,eraAtlas});extra.root.position.x=x;scene.add(extra.root);extras.push(extra);}}
  model.setDoorsOpen(opened,{gatesOnly:true});
  if(oneLeaf){model.setDoorsOpen(false,{gatesOnly:true});const p=model.pivots.find(p=>p.userData.style==='gate'&&p.userData.side==='left');if(p)model.setDoorPose(p.name,90);}
  asset.value=selected;views.value=view;
  const plan=view==='plan'&&model.building.floors.length;document.querySelector('canvas').style.display=plan?'none':'block';document.querySelector('#plan').style.display=plan?'block':'none';
  if(plan)document.querySelector('#plan').innerHTML=variantFloorSvg(model.building,Math.min(level,model.building.levels-1));

}
asset.addEventListener('change',()=>set({id:asset.value}));views.addEventListener('change',()=>set({view:views.value}));
document.querySelector('#doors').addEventListener('click',()=>set({opened:!opened}));window.addEventListener('resize',()=>render());set();
window.variantReview={ready:true,set,renderer,scene,get model(){return model;},
  async interchange(id,time=0){clearModels();const cat=await(await fetch('../../../assets/fort-variants/catalogue.json')).json(),record=cat.assets.find(r=>r.id===id),
    building=await(await fetch('../../../assets/fort-variants/'+(record.category==='part'?'parts/':'models/')+id+'.blueprint.json')).json();
    model=await loadVariantExport(T,id,location.href,building,record);scene.add(model.root);selected=id;view='exterior';asset.value=id;views.value=view;lod='glTF readback';level=0;opened=time>0;model.applyOpenAnimation(time);return render();},
  dispose(){active=false;clearModels();atlas.dispose();eraAtlas.dispose();renderer.dispose();}};
</script></html>
